<div class="realisations-container">
  <!-- Vidéo de fond -->
  <div class="video-background">
    <video #backgroundVideo autoplay muted loop class="background-video" (ended)="restartVideo()">
      <source [src]="videoSource" type="video/mp4">
      Votre navigateur ne supporte pas les vidéos HTML5.
    </video>
    <div class="video-overlay"></div>
  </div>

  <!-- Contenu principal -->
  <div class="content-wrapper">
    <!-- Titre principal -->
    <div class="header-section">
      <h1 class="main-title">RÉALISATIONS</h1>
    </div>

    <!-- Layout principal avec carousel horizontal centré -->
    <div class="main-content">
      <!-- Carousel horizontal -->
      <div class="carousel-wheel-container">
        <div class="carousel-wheel" #carouselWheel>
          <div #wheelTrack class="wheel-track">
            <div *ngFor="let realisation of realisations; let i = index" 
                 class="wheel-item"
                 [class.active]="i === currentSlide"
                 [class.adjacent]="isAdjacent(i)"
                 (click)="goToSlide(i)">
              
              <img [src]="realisation.image" 
                   [alt]="realisation.title" 
                   class="wheel-item-image">
              
              <div class="wheel-item-overlay">
                <h3 class="wheel-item-title">{{ realisation.title }}</h3>
              </div>
            </div>
          </div>

          <!-- Flèches de navigation horizontales -->
          <div class="navigation-arrows">
            <button class="nav-arrow nav-arrow-left" 
                    (click)="previousSlide()" 
                    [disabled]="!canNavigateLeft()"
                    title="Précédent">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 18L9 12L15 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            
            <button class="nav-arrow nav-arrow-right" 
                    (click)="nextSlide()" 
                    [disabled]="!canNavigateRight()"
                    title="Suivant">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 18L15 12L9 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Zone de détails sous le carousel -->
      <div class="details-container">
        <div class="realisation-details visible">
          <h3 class="realisation-title-large">{{ getCurrentRealisation().title }}</h3>
          <div class="realisation-description">
            <p>{{ getCurrentRealisation().description }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
